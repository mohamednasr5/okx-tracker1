name: 🏗️ Build OKX Tracker APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    name: Build Wear OS APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: 📦 Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: 📜 Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew
      - name: 🧹 Clean project
        run: ./gradlew clean --no-daemon
      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --warning-mode all
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKX-Tracker-WearOS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: 📋 Summary
        run: |
          echo "## ✅ APK جاهز للتحميل!" >> $GITHUB_STEP_SUMMARY
          echo "اذهب إلى Actions → هذا الـ Run → Artifacts" >> $GITHUB_STEP_SUMMARY
